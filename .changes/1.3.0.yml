version: 1.3.0
pr_number: 35
new_features:
- description: Raises the minimum supported dbt version from v1.3.0 to v1.10.0.
under_the_hood:
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10.0, the new minimum supported version.
- description: Adds the missing `is_most_recent_record` column description to the
    `stg_instagram_business__user_history` model documentation. This column was already
    present in the model output, but was not documented alongside its equivalents
    in `stg_instagram_business__media_history` and `stg_instagram_business__media_insights`.
